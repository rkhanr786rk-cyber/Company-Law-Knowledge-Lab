<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Companies Act, 2013 Reader</title>
<meta name="description" content="Read any section of the Companies Act, 2013 with the Rules made under it beside it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eceff3;--page:#fafbfc;--ink:#18222f;--muted:#566377;--rule:#d3d9e2;
  --tape:#a51f1d;--link:#1d4f91;--mark:#fff0b3;--tip:#18222f;--tipink:#f4f6f9;--fs:1;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=sepia]{--paper:#e6dcc4;--page:#f4ecd8;--ink:#2d2316;--muted:#675740;--rule:#d2c5a5;--tape:#9b2218;--link:#7a3b10;--mark:#f7dc8a;--tip:#2d2316;--tipink:#f4ecd8}
:root[data-theme=dark]{--paper:#0d1218;--page:#131a22;--ink:#e4e9f0;--muted:#93a0b3;--rule:#26313f;--tape:#ee6a60;--link:#8db7ee;--mark:#4a3f12;--tip:#e4e9f0;--tipink:#131a22;color-scheme:dark}
@media (prefers-color-scheme:dark){
  :root[data-theme=auto]{--paper:#0d1218;--page:#131a22;--ink:#e4e9f0;--muted:#93a0b3;--rule:#26313f;--tape:#ee6a60;--link:#8db7ee;--mark:#4a3f12;--tip:#e4e9f0;--tipink:#131a22;color-scheme:dark}
}
*{box-sizing:border-box}
html{scroll-padding-top:5rem;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--sans)}
a{color:var(--link)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
[hidden]{display:none!important}

/* header */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{max-width:1240px;margin:auto;padding:.65rem 1.5rem;display:flex;align-items:center;gap:1.1rem}
.brand{font:600 1.2rem/1 var(--serif);color:var(--ink);text-decoration:none;white-space:nowrap;letter-spacing:-.01em}
.find{position:relative;flex:1;max-width:27rem;min-width:0}
.tools{display:flex;align-items:center;gap:.35rem;margin-left:auto}
.tools button{background:none;border:1px solid transparent;border-radius:3px;cursor:pointer;min-width:2rem;height:2rem;padding:0 .3rem;font:500 .9rem var(--sans);color:var(--muted)}
.tools button:hover{border-color:var(--rule);color:var(--ink)}
.sw{position:relative}
.sw::after{content:"";position:absolute;inset:6px;border-radius:50%;border:1px solid var(--muted);background:var(--c)}
.sw[aria-pressed=true]{border-color:var(--ink)!important}
.sw[data-t=light]{--c:#fafbfc}.sw[data-t=sepia]{--c:#f1e5c8}.sw[data-t=dark]{--c:#131a22}
.sep{width:1px;height:1.2rem;background:var(--rule);margin:0 .3rem}

/* search */
.field{display:flex;align-items:center;background:var(--page);border:1px solid var(--rule);border-radius:3px}
.field:focus-within{border-color:var(--link);box-shadow:0 0 0 3px color-mix(in srgb,var(--link) 22%,transparent)}
.field .sym{font:500 1.25rem/1 var(--serif);padding:0 .1rem 0 .85rem;color:var(--tape)}
.field input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font:inherit;padding:.62rem .8rem;outline:0}
.field input::placeholder{color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:40;background:var(--page);border:1px solid var(--rule);border-radius:3px;box-shadow:0 16px 36px -14px rgba(8,16,30,.45);max-height:min(70vh,34rem);overflow:auto;text-align:left}
.results h4{margin:0;padding:.6rem .95rem .2rem;font:500 .82rem var(--sans);color:var(--muted)}
.res{display:flex;gap:.85rem;align-items:baseline;padding:.55rem .95rem;color:inherit;text-decoration:none}
.res[aria-selected=true],.res:hover{background:color-mix(in srgb,var(--link) 11%,transparent)}
.res b{flex:0 0 3.6rem;font:600 1.05rem var(--serif);color:var(--tape);white-space:nowrap}
.res .rt{font:500 .98rem/1.3 var(--sans)}
.res small{display:block;margin-top:.15rem;font:400 .82rem/1.3 var(--sans);color:var(--muted)}
.none{padding:.9rem .95rem;color:var(--muted);font-size:.95rem}

/* home */
.home{max-width:48rem;margin:0 auto;padding:clamp(2.2rem,9vh,5.5rem) 1.5rem 3rem}
.home h1{margin:0;font:600 clamp(2.7rem,8vw,4.8rem)/.98 var(--serif);letter-spacing:-.025em;text-wrap:balance}
.lede{margin:1.1rem 0 1.8rem;max-width:34rem;font:400 1.22rem/1.5 var(--serif);color:var(--muted)}
.home .find{max-width:none;margin:0}
.home .field input{font-size:1.2rem;padding:1.05rem .9rem}
.home .field .sym{font-size:1.6rem;padding-left:1.1rem}
.hint{margin:.8rem 0 0;font-size:.92rem;color:var(--muted)}
.hint kbd{font:500 .8rem var(--sans);border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 .3rem;background:var(--page)}
.home h2{margin:3.6rem 0 .6rem;font:600 1.5rem var(--serif);letter-spacing:-.01em}
.toc details{border-bottom:1px solid var(--rule)}
.toc summary{display:flex;align-items:baseline;gap:.75rem;padding:.62rem 0;cursor:pointer;list-style:none}
.toc summary::-webkit-details-marker{display:none}
.toc .ch{flex:0 0 3rem;font:600 1rem var(--serif);color:var(--tape)}
.toc .ct{font:400 1.08rem/1.3 var(--serif)}
.toc .dots{flex:1;min-width:1.5rem;border-bottom:2px dotted var(--rule);transform:translateY(-.25em)}
.toc .rng{font:400 .9rem var(--sans);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.toc summary:hover .ct{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:.2em}
.secs{columns:2 17rem;column-gap:2rem;list-style:none;margin:0;padding:.3rem 0 1.1rem 3.75rem}
.secs a{display:flex;gap:.6rem;padding:.22rem 0;color:var(--ink);text-decoration:none;font:400 .95rem/1.35 var(--sans);break-inside:avoid}
.secs a:hover{color:var(--link)}
.secs b{flex:0 0 2.4rem;font:600 .95rem var(--serif);color:var(--tape)}
.foot{max-width:48rem;margin:0 auto;padding:1.5rem 1.5rem 3rem;color:var(--muted);font-size:.86rem;border-top:1px solid var(--rule)}
.foot p{margin:.2rem 0}

/* reader */
.reader{max-width:1400px;margin:0 auto;padding:2.4rem 1.5rem 4rem;display:grid;grid-template-columns:11rem minmax(0,38rem) minmax(22rem,32rem);gap:2.8rem;justify-content:center}
.margin{position:sticky;top:5.4rem;align-self:start}
.secnum{font:300 clamp(3.6rem,6vw,5.4rem)/.9 var(--serif);letter-spacing:-.035em;font-variant-numeric:lining-nums}
.chap{margin-top:1.1rem;font:500 .92rem/1.35 var(--sans);color:var(--ink)}
.chapt{margin-top:.15rem;font:400 .9rem/1.4 var(--sans);color:var(--muted)}
.text{position:relative;min-width:0}
.tapewrap{position:absolute;left:-1.5rem;top:0;bottom:0;width:6px}
.tape{position:sticky;top:5.4rem;height:calc(100vh - 7.2rem);min-height:8rem;width:4px;background:var(--rule);border-radius:2px;margin-left:1px}
.tape i{position:absolute;left:0;top:0;width:100%;height:calc(var(--p,0)*100%);background:var(--tape);border-radius:2px}
.tape b{position:absolute;left:50%;top:calc(var(--p,0)*100%);width:13px;height:13px;margin:-6px 0 0 -6.5px;border-radius:50%;background:var(--tape);box-shadow:0 0 0 3px var(--paper)}
.text h1{margin:0 0 1.6rem;font:600 clamp(1.85rem,4vw,2.55rem)/1.12 var(--serif);letter-spacing:-.018em;text-wrap:balance}
.text h1:focus{outline:0}
.badge{display:inline-block;margin:0 0 1rem;padding:.1rem .55rem;border:1px solid var(--tape);color:var(--tape);border-radius:2px;font:500 .85rem var(--sans)}
.body{font-family:var(--serif);font-size:calc(1.22rem*var(--fs));line-height:1.72;font-variation-settings:"opsz" 16;hyphens:auto;overflow-wrap:break-word}
.p{margin:0 0 .85em}
.lbl{display:inline-block;width:2.4em;text-indent:0;color:var(--muted);font-variant-numeric:lining-nums tabular-nums}
.p.sub{padding-left:2.4em;text-indent:-2.4em}
.p.clause{margin-left:2.4em;padding-left:2.4em;text-indent:-2.4em}
.p.subclause{margin-left:4.8em;padding-left:2.4em;text-indent:-2.4em}
.p.proviso,.p.expl{margin-left:2.4em;padding-left:1em;border-left:2px solid var(--rule);font-size:.95em}
.p.expl{color:var(--muted)}
.body a{text-decoration-color:color-mix(in srgb,var(--link) 45%,transparent);text-underline-offset:.16em}
.def{border-bottom:1px dotted var(--muted);cursor:help}
.flash{animation:flash 2.6s ease-out}
.p.sel{background:color-mix(in srgb,var(--mark) 55%,transparent);box-shadow:-.6em 0 0 color-mix(in srgb,var(--mark) 55%,transparent),.6em 0 0 color-mix(in srgb,var(--mark) 55%,transparent)}
.p.sub .lbl{cursor:pointer}
.rb{float:right;margin:.3em 0 0 .8em;text-indent:0;padding:0 .5rem;height:1.5rem;border:1px solid color-mix(in srgb,var(--tape) 55%,transparent);border-radius:99px;background:var(--page);color:var(--tape);font:600 .78rem/1 var(--sans);cursor:pointer}
.rb:hover,.rb[aria-pressed=true]{background:var(--tape);color:var(--page)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0 .6rem}
.chips button{border:1px solid var(--rule);border-radius:99px;background:var(--page);padding:.18rem .7rem;font:500 .85rem var(--sans);cursor:pointer;color:var(--ink)}
.chips button:hover{border-color:var(--muted)}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.chips span{color:var(--muted);margin-left:.3rem;font-weight:400}
.chips button[aria-pressed=true] span{color:inherit;opacity:.75}
@keyframes flash{from{background:var(--mark)}to{background:transparent}}
.omitted{font:400 1rem/1.6 var(--sans);color:var(--muted)}
.notes{margin-top:2rem;border-top:1px solid var(--rule);padding-top:.9rem;font:400 .9rem/1.55 var(--sans);color:var(--muted)}
.notes summary,.lowgroup>summary{cursor:pointer;font-weight:500;color:var(--ink)}
.notes ol{margin:.7rem 0 0;padding-left:1.2rem}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-top:2.6rem;padding-top:1.2rem;border-top:1px solid var(--rule)}
.pn a{display:block;padding:.3rem 0;color:var(--ink);text-decoration:none;font:400 .95rem/1.35 var(--sans)}
.pn a:hover b{text-decoration:underline}
.pn .nx{text-align:right;grid-column:2}
.pn span{display:block;color:var(--muted);font-size:.85rem}
.pn b{font:600 1.05rem var(--serif);margin-right:.35rem;color:var(--tape)}

/* side panel */
.side{position:sticky;top:5.4rem;align-self:start;max-height:calc(100vh - 6.6rem);overflow:auto;border-left:1px solid var(--rule);padding:0 0 1.5rem 1.4rem}
.tabs{display:flex;gap:1.3rem;border-bottom:1px solid var(--rule);margin-bottom:.9rem;position:sticky;top:0;background:var(--paper)}
.tabs button,.mtabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:.5rem 0;font:600 .95rem var(--sans);color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true],.mtabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--tape)}
.count{margin-left:.35rem;font-weight:500;color:var(--muted)}
.mtabs{display:none;gap:1.4rem;border-bottom:1px solid var(--rule);margin:0 0 1.4rem}
.side h3{margin:0 0 .25rem;font:600 1.02rem/1.3 var(--serif)}
.side .small{margin:.2rem 0 .8rem;font:400 .9rem/1.5 var(--sans);color:var(--muted)}
.set{margin:1.3rem 0 0}
.rl{list-style:none;margin:0;padding:0}
.rl details,.lowgroup{border-top:1px solid var(--rule)}
.rl summary{display:flex;gap:.65rem;align-items:baseline;padding:.6rem 0;cursor:pointer;list-style:none;font:400 .98rem/1.38 var(--sans)}
.rl summary::-webkit-details-marker,.lowgroup>summary::-webkit-details-marker,.notes summary::-webkit-details-marker{display:none}
.rl summary::before{content:"+";flex:0 0 .8rem;color:var(--muted);font-weight:600}
.rl details[open]>summary::before{content:"–"}
.rn{font-weight:600;white-space:nowrap}
.flag{margin-left:auto;font:500 .74rem var(--sans);color:var(--tape);border:1px solid color-mix(in srgb,var(--tape) 50%,transparent);padding:0 .35rem;border-radius:2px;white-space:nowrap}
.rbody{padding:.1rem 0 1.2rem 1.45rem;font-family:var(--serif);font-size:calc(1.08rem*var(--fs));line-height:1.68}
.rbody .p{margin-bottom:.6em}
.rbody .small{font-family:var(--sans)}
.rbody .hit{box-shadow:-9px 0 0 -6px var(--tape)}
.more{display:block;margin:0 0 .7rem;padding:.2rem .7rem;border:1px solid var(--rule);border-radius:99px;background:var(--page);font:500 .82rem var(--sans);color:var(--ink);cursor:pointer}
.more:hover{border-color:var(--muted)}
.lowgroup{margin-top:1.6rem;padding-top:.7rem}
.soon{margin:.8rem 0 1rem;padding-left:1.1rem;color:var(--muted)}
.empty{margin:.4rem 0;font:400 1rem/1.55 var(--serif);color:var(--muted)}

#tip{position:fixed;z-index:60;left:0;top:0;max-width:23rem;background:var(--tip);color:var(--tipink);padding:.7rem .9rem;border-radius:3px;font:400 .9rem/1.45 var(--sans);pointer-events:none;opacity:0;transition:opacity .12s}
#tip b{display:block;margin-bottom:.25rem;font-weight:600}
#tip em{display:block;margin-top:.45rem;font-size:.8rem;opacity:.75;font-style:normal}

.msg{max-width:36rem;margin:0 auto;padding:4rem 1.5rem;font:400 1.2rem/1.55 var(--serif)}
.msg .find{margin-top:1.4rem;max-width:none}

@media (max-width:1180px){
  .reader{grid-template-columns:minmax(0,34rem) minmax(20rem,1fr);grid-template-areas:"margin margin" "text side";gap:1.6rem 2.4rem}
  .margin{grid-area:margin;position:static;display:flex;align-items:baseline;flex-wrap:wrap;gap:.3rem 1.3rem}
  .secnum{font-size:3.4rem}
  .chap{margin:0}.chapt{margin:0}
  .text{grid-area:text}.side{grid-area:side}
}
@media (max-width:820px){
  .bar-in{padding:.55rem 1rem;gap:.6rem}
  .brand{font-size:1.05rem}
  .reader:not([data-tab=section]) .margin{display:none}
  .tools .sep,.tools [data-fs]{display:none}
  .reader{display:block;padding:1.2rem 1.1rem 3.5rem}
  .margin{margin-bottom:1rem}
  .tapewrap{left:-.85rem}
  .text{padding-left:0}
  .mtabs{display:flex;position:sticky;top:3.4rem;z-index:10;background:var(--paper)}
  .tabs{display:none}
  .side{position:static;max-height:none;overflow:visible;border:0;padding:0}
  .reader[data-tab=section] .side,.reader:not([data-tab=section]) .text{display:none}
  .body{font-size:calc(1.14rem*var(--fs))}
  .p.sub,.p.clause,.p.subclause{padding-left:2.1em}
  .p.clause{margin-left:1.6em}.p.subclause{margin-left:3.2em}
  .lbl{width:2.1em}
  .p.sub,.p.clause,.p.subclause{text-indent:-2.1em}
  .results{position:fixed;left:.6rem;right:.6rem;top:3.6rem}
  .home .results{position:absolute;left:0;right:0;top:calc(100% + 5px)}
}
.reader:not([data-tab=deep]) .panel[data-p=deep]{display:none}
.reader[data-tab=deep] .panel[data-p=rules]{display:none}
@media (prefers-reduced-motion:reduce){.flash{animation:none;background:var(--mark)}#tip{transition:none}}

/* the web */
.reader[data-tab=deep]{grid-template-columns:11rem minmax(0,52rem)}
.reader[data-tab=deep] .text{display:none}
.reader[data-tab=deep] .side{grid-column:2;position:static;max-height:none;border-left:0;padding-left:0}
@media (max-width:1180px){.reader[data-tab=deep]{grid-template-columns:minmax(0,52rem);grid-template-areas:"margin" "side"}}
.webbox{max-width:46rem;margin:.4rem auto 0}
.web{display:block;width:100%;height:auto}
.web .ring,.web .spoke{fill:none;stroke:var(--rule);stroke-width:1}
.web .th{fill:none;stroke-width:1.6;opacity:.8}.web .th.sub{stroke-width:1;opacity:.65}
.web .th.co{stroke:var(--ink);stroke-dasharray:1 4;stroke-linecap:round;opacity:.55}.web .th.out{stroke:var(--link)}.web .th.in{stroke:var(--muted)}.web .th.rule{stroke:var(--tape)}.web .th.low{stroke-dasharray:3 4}
.web text{font-family:var(--sans)}
.web .hl{fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;font-weight:500}
.web .hub{fill:var(--paper);stroke-width:2}.web .hub.co{stroke:var(--ink)}.web .hub.out{stroke:var(--link)}.web .hub.in{stroke:var(--muted)}.web .hub.rule{stroke:var(--tape)}
.web .lt{text-anchor:middle;dominant-baseline:central;font-weight:600;pointer-events:none}
.web .nd{cursor:pointer;outline:0}
.web .sec circle{fill:var(--page);stroke:var(--link);stroke-width:1.6}.web .sec .lt{fill:var(--link)}.web .sec.co circle{stroke-dasharray:2 2}
.web .ru rect{fill:var(--page);stroke:var(--tape);stroke-width:1.6}.web .ru .lt{fill:var(--tape)}.web .ru.low rect{stroke-dasharray:3 2}
.web .nd:hover circle,.web .nd:hover rect,.web .nd:focus-visible circle,.web .nd:focus-visible rect{fill:var(--mark);stroke-width:3}
.web .mr circle{fill:none;stroke:var(--muted);stroke-dasharray:3 3}.web .mr .lt{fill:var(--muted)}
.web .ctr{fill:var(--tape)}.web .ct{fill:var(--page);text-anchor:middle;dominant-baseline:central;font-family:var(--serif);font-weight:600}
.webcap b{display:block;margin-bottom:.2rem}.webcap .q{display:block;margin-top:.35rem;color:var(--muted);font-size:.86rem;font-style:italic}.sum{margin:.2rem 0 .5rem;font:400 1.12rem/1.55 var(--serif)}.webcap{min-height:9em;margin:.4rem auto 0;max-width:46rem;font:400 .95rem/1.5 var(--sans);text-align:center}
.legend{max-width:46rem;margin:.2rem auto 0;font:400 .88rem/1.5 var(--sans);color:var(--muted);text-align:center}
.legend .k{display:inline-block;width:.8rem;height:.8rem;margin:0 .3rem 0 .4rem;vertical-align:-.1em;border:1.5px solid}
.legend .k.s{border-radius:50%;border-color:var(--link)}.legend .k.r{border-radius:2px;border-color:var(--tape)}
.lowtoggle{display:block;margin:1.1rem auto 0;max-width:46rem;font:400 .92rem/1.4 var(--sans)}
.wlist{max-width:46rem;margin:1.2rem auto 0;border-top:1px solid var(--rule);padding-top:.7rem}
.wlist summary{cursor:pointer;font-weight:500}
.wlist h4{margin:1rem 0 .2rem;font:600 .95rem var(--serif)}
.wlist ul{margin:0;padding:0;list-style:none;columns:2 15rem;column-gap:1.5rem}
.wlist li{break-inside:avoid;padding:.12rem 0;font:400 .9rem/1.35 var(--sans)}
.wlist .why{display:block;margin:.1rem 0 .5rem;color:var(--muted);font-size:.84rem;line-height:1.4}
.wlist .why.q{font-style:italic;margin-top:-.35rem}
.wlist .lnk{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--link);text-decoration:underline;text-underline-offset:.15em}
.side h3.cases{margin-top:2.4rem;padding-top:1rem;border-top:1px solid var(--rule)}

/* wider reading area for the Rules, and the AI explanation */
.tabs .wide{margin-left:auto;border:1px solid var(--rule);border-radius:99px;padding:.15rem .8rem;margin-bottom:.35rem;font:500 .84rem var(--sans);color:var(--ink)}
.tabs .wide:hover{border-color:var(--muted)}
.reader[data-tab=deep] .tabs .wide{display:none}
@media (min-width:821px){
  .reader[data-wide="1"]:not([data-tab=deep]){grid-template-columns:11rem minmax(0,56rem)}
  .reader[data-wide="1"]:not([data-tab=deep]) .text{display:none}
  .reader[data-wide="1"]:not([data-tab=deep]) .side{grid-column:2;position:static;max-height:none;border-left:0;padding-left:0}
  .reader[data-wide="1"] .rbody{font-size:calc(1.2rem*var(--fs));line-height:1.75;max-width:46rem}
  .reader[data-wide="1"] .rl summary{font-size:1.04rem}
}
@media (min-width:821px) and (max-width:1180px){.reader[data-wide="1"]:not([data-tab=deep]){grid-template-columns:minmax(0,56rem);grid-template-areas:"margin" "side"}}
@media (max-width:820px){.tabs .wide{display:none}}
.ai{margin:0 0 1.8rem;padding-bottom:1.5rem;border-bottom:1px solid var(--rule);max-width:46rem}
.ai h3{margin:0 0 .5rem}
.ai h4{margin:1.2rem 0 .35rem;font:600 .98rem var(--serif)}
.aisum{margin:0;font:400 1.15rem/1.6 var(--serif)}
.aipts{margin:.7rem 0 0;padding-left:1.2rem;font:400 1.03rem/1.55 var(--serif)}
.aipts li{margin:.15rem 0}
.aiex{margin:0;padding:.75rem 1rem;border-left:3px solid var(--link);background:color-mix(in srgb,var(--link) 7%,transparent);font:400 1.05rem/1.62 var(--serif)}
.aiwatch{margin:.9rem 0 0;font:400 .98rem/1.5 var(--serif)}
.aiterms{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:.25rem 1rem;font:400 .95rem/1.45 var(--sans)}
.aiterms dt{font-weight:600}.aiterms dd{margin:0}
.ainote{margin-top:1rem}
.aibox{margin:0 0 1rem;border:1px solid var(--rule);border-radius:3px;padding:.1rem .9rem .8rem;background:var(--page)}
.aibox:not([open]){padding-bottom:.1rem}
.aibox summary{cursor:pointer;padding:.5rem 0;font:600 .92rem var(--sans);color:var(--link)}
.aibox .aisum{font-size:1.05rem}.aibox .aiex{font-size:1rem}.aibox .aipts{font-size:.98rem}

/* drafting */
.navlink{font:500 .92rem var(--sans);color:var(--muted);text-decoration:none;padding:.3rem .1rem;border-bottom:2px solid transparent;white-space:nowrap}
.navlink:hover,.navlink[aria-current=page]{color:var(--ink);border-bottom-color:var(--tape)}
.dr{max-width:60rem;margin:0 auto;padding:clamp(2rem,7vh,4rem) 1.5rem 3rem}
.dr h1{margin:0;font:600 clamp(2.4rem,7vw,4rem)/1 var(--serif);letter-spacing:-.025em}
.dr .find{max-width:none;margin:0 0 .6rem}
.dr .field input{font-size:1.1rem;padding:.9rem .9rem}
.dcat{margin:2rem 0 .6rem;font:600 1.3rem var(--serif);display:flex;gap:.7rem;align-items:baseline}
.dcat small{font:400 .88rem var(--sans);color:var(--muted)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.7rem}
.dcard{display:block;padding:.8rem .95rem;background:var(--page);border:1px solid var(--rule);border-left:3px solid var(--tape);border-radius:3px;color:var(--ink);text-decoration:none}
.dcard:hover{border-color:var(--ink);border-left-color:var(--tape)}
.dcard b{display:block;font:600 1.05rem/1.3 var(--serif)}
.dcard span{display:block;margin-top:.25rem;font:400 .86rem/1.4 var(--sans);color:var(--muted)}
.dcard small{display:block;margin-top:.45rem;font:500 .8rem var(--sans);color:var(--tape)}
.df{max-width:1240px;margin:0 auto;padding:1.2rem 1.5rem 3rem;display:grid;grid-template-columns:minmax(18rem,25rem) minmax(0,1fr);gap:2rem;align-items:start}
.df-head{grid-column:1/-1}
.df-head a{font:500 .9rem var(--sans)}
.df-head h1{margin:.4rem 0 0;font:600 clamp(1.7rem,4vw,2.4rem)/1.12 var(--serif);letter-spacing:-.018em}
.df-head p{margin:.3rem 0 0;color:var(--muted);font:400 .95rem var(--sans)}
.df-form{position:sticky;top:4.3rem;max-height:calc(100vh - 5.2rem);overflow:auto;padding-right:.4rem}
.fld{margin:0 0 1rem}
.fld label{display:block;margin:0 0 .25rem;font:600 .92rem/1.3 var(--sans)}
.fld label i{font:400 .8rem var(--sans);color:var(--muted);font-style:normal;margin-left:.3rem}
.fld input,.fld textarea,.fld select{width:100%;box-sizing:border-box;padding:.6rem .7rem;border:1px solid var(--rule);border-radius:3px;background:var(--page);color:var(--ink);font:400 1rem var(--sans)}
.fld textarea{min-height:5rem;resize:vertical}
.fld small{display:block;margin-top:.2rem;color:var(--muted);font:400 .8rem var(--sans)}
.dbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:0 0 1.1rem;padding:0 0 .9rem;border-bottom:1px solid var(--rule)}
.dbar .prog{flex:1 1 100%;font:500 .85rem var(--sans);color:var(--muted)}
.dbar .prog i{display:block;height:4px;margin-top:.3rem;background:var(--rule);border-radius:2px;overflow:hidden}
.dbar .prog i b{display:block;height:100%;width:var(--w,0%);background:var(--tape)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--page);border-radius:3px;padding:.6rem 1.1rem;font:600 .95rem var(--sans);cursor:pointer}
.btn:hover{background:var(--tape);border-color:var(--tape)}
.btn.alt{background:none;color:var(--ink);border-color:var(--rule)}
.btn.alt:hover{border-color:var(--ink);background:none;color:var(--ink)}
.btn[disabled]{opacity:.6;cursor:wait}
.dmsg{margin:.6rem 0 .9rem;font:400 .88rem/1.4 var(--sans);color:var(--muted)}
.sheetwrap h2{margin:0 0 .5rem;font:600 1rem var(--sans);color:var(--muted)}
.sheet{background:var(--page);border:1px solid var(--rule);box-shadow:0 14px 32px -20px rgba(8,16,30,.5);padding:clamp(1.2rem,4vw,2.6rem);font:400 1.02rem/1.7 var(--serif);overflow-wrap:break-word}
.sheet p{margin:0 0 .55rem;white-space:pre-wrap}
.sheet .k-b{font-weight:700}.sheet .k-c{text-align:center}.sheet .k-r{text-align:right}
.sheet .k-h{font-size:1.2em;font-weight:700;margin-top:.9rem}
.sheet .k-t{padding-left:1.2rem;border-left:2px solid var(--rule)}
.sheet .gap{height:.6rem}
.sheet .tb{display:inline-block;width:2em}
.sheet .v{background:var(--mark);border-radius:2px;cursor:pointer;padding:0 .12em}
.sheet .bl{border-bottom:1.5px dotted var(--tape);color:var(--tape);font:500 .78em var(--sans);cursor:pointer;padding:0 .25em;background:color-mix(in srgb,var(--tape) 7%,transparent)}
.sheet .on{outline:2px solid var(--link);outline-offset:1px}
@media (max-width:820px){.df{grid-template-columns:minmax(0,1fr);gap:1.2rem}.df-form{position:static;max-height:none;padding:0}.bar-in{gap:.6rem;padding:.55rem 1rem}.navlink{font-size:.85rem}}
@media print{.df-form,.df-head{display:none!important}.df{display:block;padding:0}.sheet{border:0;box-shadow:none}}
@media print{.bar,.side,.mtabs,.tapewrap,.pn,.foot{display:none!important}.reader{display:block}body{background:#fff}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#/">Companies Act, 2013</a>
    <a class="navlink" id="navdraft" href="#/drafts">Drafting</a>
    <div class="find" id="barfind" hidden>
      <div class="field"><span class="sym" aria-hidden="true">§</span>
        <input id="q2" type="search" placeholder="Section number or topic" autocomplete="off" spellcheck="false" aria-label="Search the Act" role="combobox" aria-expanded="false" aria-controls="res2"></div>
      <div class="results" id="res2" role="listbox" hidden></div>
    </div>
    <div class="tools" role="group" aria-label="Reading settings">
      <button data-fs="-1" aria-label="Smaller text" title="Smaller text">A−</button>
      <button data-fs="1" aria-label="Larger text" title="Larger text">A+</button>
      <span class="sep"></span>
      <button class="sw" data-t="light" aria-label="Light page" title="Light page" aria-pressed="false"></button>
      <button class="sw" data-t="sepia" aria-label="Sepia page" title="Sepia page" aria-pressed="false"></button>
      <button class="sw" data-t="dark" aria-label="Dark page" title="Dark page" aria-pressed="false"></button>
    </div>
  </div>
</header>

<main id="view"><p class="msg">Loading the Act…</p></main>

<footer class="foot" id="foot" hidden>
  <p>For study only. This is not legal advice. Check the wording against the official gazette or India Code before relying on it.</p>
  <p id="built"></p>
</footer>
<div id="tip" role="tooltip"></div>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const nice = s => { const t = (s || "").trim(); return t && t === t.toUpperCase() ? t.charAt(0) + t.slice(1).toLowerCase() : t; };
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const S = { idx:null, map:{}, order:[], ft:null, ftKeys:[], defs:null, defRe:null, cache:new Map(), cur:null, tab:"section", token:0 };

const getJSON = url => {
  if (!S.cache.has(url)) S.cache.set(url, fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).catch(e => { S.cache.delete(url); throw e; }));
  return S.cache.get(url);
};

/* ---------- reading settings ---------- */
function applyPrefs() {
  const root = document.documentElement;
  const t = store.get("theme") || "auto";
  root.dataset.theme = t;
  $$(".sw").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === t)));
  const fs = parseFloat(store.get("fs") || "1");
  root.style.setProperty("--fs", isFinite(fs) ? fs : 1);
}
document.addEventListener("click", e => {
  const sw = e.target.closest(".sw");
  if (sw) { store.set("theme", sw.dataset.t); applyPrefs(); }
  const fb = e.target.closest("[data-fs]");
  if (fb) { const cur = parseFloat(store.get("fs") || "1"); store.set("fs", String(Math.min(1.45, Math.max(.85, +(cur + fb.dataset.fs * .08).toFixed(2))))); applyPrefs(); }
});

/* ---------- search ---------- */
const parseRef = q => {
  const m = q.trim().match(/^(?:s\.?|sec\.?|section)?\s*(\d{1,3}[a-z]{0,2})((?:\s*\(\s*[^)]{1,6}\s*\))*)$/i);
  if (!m) return null;
  const sub = (m[2].match(/\(\s*([^)]{1,6}?)\s*\)/) || [])[1];
  return { n: m[1].toUpperCase(), sub };
};
const secRow = n => S.idx.sections[S.map[n]];
const secItem = (n, sub) => {
  const r = secRow(n);
  const where = r[2] ? `Chapter ${esc(r[2])}, ${esc(nice(r[3]))}` : "";
  const extra = r[5] ? `${where ? ", " : ""}${r[5]} ${r[5] === 1 ? "rule" : "rules"}` : "";
  return { href: `#/s/${n}${sub ? "?sub=" + encodeURIComponent(sub) : ""}`,
    html: `<a class="res" role="option" href="#/s/${n}${sub ? "?sub=" + encodeURIComponent(sub) : ""}"><b>${esc(n)}</b><span class="rt">${esc(r[1])}${r[4] ? " (omitted)" : ""}<small>${where}${extra}</small></span></a>` };
};
async function search(q) {
  const out = { sections: [], rules: [], exact: null };
  const ref = parseRef(q);
  if (ref) {
    if (S.map[ref.n] !== undefined) { out.exact = ref.n; out.sections.push(secItem(ref.n, ref.sub)); }
    if (!ref.sub) S.order.filter(n => n !== ref.n && n.startsWith(ref.n)).slice(0, 6).forEach(n => out.sections.push(secItem(n)));
    if (out.sections.length) return out;
  }
  const toks = (q.toLowerCase().match(/[a-z0-9]{2,}/g) || []);
  if (!toks.length) return out;
  if (!S.ft) { try { S.ft = await getJSON("data/fulltext.json"); S.ftKeys = Object.keys(S.ft); } catch(e) { S.ft = {}; } }
  const per = toks.map(t => { const s = new Set(); let n = 0; for (const k of S.ftKeys) { if (k.startsWith(t) && n++ < 80) S.ft[k].forEach(i => s.add(i)); } return s; });
  const score = (i, strict) => {
    const r = S.idx.sections[i], title = r[1].toLowerCase(), chap = (r[3] || "").toLowerCase();
    let sc = 0, miss = 0;
    toks.forEach((t, j) => {
      const inTitle = title.includes(t), inText = per[j].has(i), inChap = chap.includes(t);
      if (!inTitle && !inText && !inChap) miss++;
      sc += (inTitle ? 6 : 0) + (inText ? 1 : 0) + (inChap ? 2 : 0);
    });
    return strict ? (miss ? -1 : sc) : (miss === toks.length ? -1 : sc - miss * 3);
  };
  let hits = [];
  for (const strict of [true, false]) {
    hits = S.idx.sections.map((r, i) => [i, score(i, strict)]).filter(x => x[1] > 0 && !S.idx.sections[x[0]][4]);
    if (hits.length) break;
  }
  hits.sort((a, b) => b[1] - a[1] || a[0] - b[0]);
  hits.slice(0, 10).forEach(([i]) => out.sections.push(secItem(S.order[i])));
  S.idx.rules.filter(r => { const hay = (r[2] + " " + S.idx.sets[r[0]].name).toLowerCase(); return toks.every(t => hay.includes(t)); })
    .slice(0, 5).forEach(r => out.rules.push({ href: `#/s/${r[3]}?rule=${r[0]}:${encodeURIComponent(r[1])}&tab=rules`,
      html: `<a class="res" role="option" href="#/s/${r[3]}?rule=${r[0]}:${encodeURIComponent(r[1])}&tab=rules"><b>Rule ${esc(r[1])}</b><span class="rt">${esc(r[2])}<small>${esc(S.idx.sets[r[0]].name)}, section ${esc(r[3])}</small></span></a>` }));
  return out;
}
function mountSearch(input, box) {
  let items = [], sel = -1, timer = 0, seq = 0;
  const close = () => { box.hidden = true; sel = -1; input.setAttribute("aria-expanded", "false"); };
  const mark = () => $$(".res", box).forEach((a, i) => a.setAttribute("aria-selected", String(i === sel)));
  const run = async () => {
    const q = input.value, my = ++seq;
    if (!q.trim()) return close();
    const r = await search(q);
    if (my !== seq) return;
    items = [...r.sections, ...r.rules];
    let h = "";
    if (r.sections.length) h += `<h4>Sections</h4>` + r.sections.map(x => x.html).join("");
    if (r.rules.length) h += `<h4>Rules</h4>` + r.rules.map(x => x.html).join("");
    if (!h) h = parseRef(q) ? `<div class="none">The Act has no section ${esc(q.trim())}. Sections run from 1 to ${esc(S.order[S.order.length - 1])}.</div>`
                            : `<div class="none">Nothing found for “${esc(q.trim())}”. Try fewer or simpler words.</div>`;
    box.innerHTML = h; box.hidden = false; input.setAttribute("aria-expanded", "true"); sel = r.exact ? 0 : -1; mark();
  };
  input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 70); });
  input.addEventListener("focus", () => { if (input.value) run(); });
  input.addEventListener("blur", () => setTimeout(close, 160));
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!items.length) return; sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; mark(); $$(".res", box)[sel].scrollIntoView({ block: "nearest" }); }
    else if (e.key === "Enter") { const pick = items[sel >= 0 ? sel : 0]; if (pick) { e.preventDefault(); location.hash = pick.href; input.blur(); input.value = ""; close(); } else { run(); } }
    else if (e.key === "Escape") { close(); input.blur(); }
  });
  box.addEventListener("mousedown", e => { const a = e.target.closest("a"); if (a) { setTimeout(() => { input.value = ""; close(); }, 0); } });
}

/* ---------- text rendering ---------- */
const REF = /\b(sections?|sub-sections?)(\s+)(\d{1,3}[A-Z]{0,2}(?:\([0-9A-Za-z]{1,4}\))*(?:\s*(?:,|and|or|to)\s*\d{1,3}[A-Z]{0,2}(?:\([0-9A-Za-z]{1,4}\))*)*)/g;
function linkRefs(h) {
  return h.replace(REF, (m, w, sp, list, off) => {
    const after = h.slice(off + m.length, off + m.length + 100);
    const o = after.match(/^\s*(?:of|under)\s+(?:the\s+)?([A-Z][A-Za-z’' ()\-]{2,70}?)\s*\b(?:Act|Code)\b/);
    if (o && !/^Companies/.test(o[1].trim())) return m;
    return w + sp + list.replace(/(\d{1,3}[A-Z]{0,2})((?:\([0-9A-Za-z]{1,4}\))*)/g, (x, n, subs) => {
      if (S.map[n] === undefined) return x;
      const s1 = (subs.match(/\(([0-9A-Za-z]{1,4})\)/) || [])[1];
      return `<a href="#/s/${n}${s1 ? "?sub=" + s1 : ""}">${n}${subs}</a>`;
    });
  });
}
function markDefs(h, seen) {
  if (!S.defRe) return h;
  let inA = 0;
  return h.split(/(<[^>]+>)/).map(seg => {
    if (seg[0] === "<") { if (/^<a\b/i.test(seg)) inA++; else if (/^<\/a>/i.test(seg)) inA--; return seg; }
    if (inA > 0) return seg;
    return seg.replace(S.defRe, m => { const k = m.toLowerCase(); if (seen.has(k)) return m; seen.add(k); return `<span class="def" tabindex="0" data-t="${esc(k)}">${m}</span>`; });
  }).join("");
}
function para(p, ctx) {
  let h = linkRefs(esc(p.x));
  if (ctx.seen) h = markDefs(h, ctx.seen);
  const lab = p.l ? `<span class="lbl">${esc(p.l)}</span>` : "";
  let badge = "";
  if (ctx.counts) {
    if (p.k === "sub") ctx.cur = p.l.replace(/[()]/g, ""); else if (p.k === "p") ctx.cur = "";
    const c = p.k === "sub" ? ctx.counts[ctx.cur] : 0;
    if (c) badge = `<button class="rb" data-sub="${esc(ctx.cur)}" aria-pressed="false" title="Rules that cite sub-section ${esc(p.l)}">${c} ${c === 1 ? "rule" : "rules"}</button>`;
  }
  return `<p class="p ${p.k}"${p.l ? ` data-l="${esc(p.l)}"` : ""}${ctx.counts ? ` data-sub="${esc(ctx.cur || "")}"` : ""}>${badge}${lab}${h}</p>`;
}

/* ---------- views ---------- */
const view = $("#view");
const show = (h, foot = true) => { view.innerHTML = h; $("#foot").hidden = !foot; };
function setChrome(home) {
  $("#barfind").hidden = home;
  $("#built").textContent = S.idx ? `Built on ${S.idx.built}. ${S.idx.sections.length} sections and ${S.idx.sets.reduce((a, s) => a + s.n, 0)} rules in ${S.idx.sets.length} sets of Rules.` : "";
}
function renderHome() {
  const I = S.idx;
  const toc = I.chapters.map(c => `<details><summary><span class="ch">${esc(c.c)}</span><span class="ct">${esc(nice(c.t))}</span><span class="dots"></span><span class="rng">${esc(c.first)}${c.last !== c.first ? "–" + esc(c.last) : ""}</span></summary>
    <ul class="secs">${I.sections.filter(r => r[2] === c.c).map(r => `<li><a href="#/s/${esc(r[0])}"><b>${esc(r[0])}</b><span>${esc(r[1])}${r[4] ? " (omitted)" : ""}</span></a></li>`).join("")}</ul></details>`).join("");
  S.homeHTML = `<section class="home">
    <h1>Companies Act, 2013</h1>
    <p class="lede">Type a section number or a topic. The Rules made under that section open beside it.</p>
    <div class="find"><div class="field"><span class="sym" aria-hidden="true">§</span>
      <input id="q1" type="search" placeholder="164, or disqualification of director" autocomplete="off" spellcheck="false" aria-label="Search the Act" role="combobox" aria-expanded="false" aria-controls="res1"></div>
      <div class="results" id="res1" role="listbox" hidden></div></div>
    <p class="hint">Also works: <b>s.149(1)</b>, <b>section 42</b>, a rule title. Press <kbd>/</kbd> to search from any page.</p>
    <p class="hint">Need a ready draft? <a href="#/drafts">Open Drafting</a>: pick a draft, fill in the details and download it as a Word file.</p>
    <h2>Contents</h2><div class="toc">${toc}</div></section>`;
}
function showHome() {
  S.cur = null; document.title = "Companies Act, 2013 Reader"; setChrome(true);
  show(S.homeHTML); mountSearch($("#q1"), $("#res1")); window.scrollTo(0, 0);
  if (!matchMedia("(pointer:coarse)").matches) $("#q1").focus();
}
function showMessage(html) {
  setChrome(false); show(`<div class="msg">${html}</div>`);
}

const KEEP = { sub: 1 };
function subCounts(d) {
  const c = {};
  d.rules.filter(r => r.conf !== "low").forEach(r => (r.sb || []).forEach(x => { c[x] = (c[x] || 0) + 1; }));
  return c;
}
function rulesPanel(d, sub) {
  const all = d.rules, direct = all.filter(r => r.conf !== "low"), low = all.filter(r => r.conf === "low");
  const item = r => `<li><details data-set="${r.set}" data-rule="${esc(r.rule)}" data-ps='${JSON.stringify(r.ps || [])}'><summary><span class="rn">Rule ${esc(r.rule)}</span><span class="rt">${esc(r.t || "No heading")}</span>${r.conf === "medium" ? `<span class="flag" title="This rule mentions the section but does not say which Act. Read it to confirm.">verify</span>` : ""}</summary><div class="rbody"></div></details></li>`;
  const sets = list => { const m = new Map(); list.forEach(r => { if (!m.has(r.set)) m.set(r.set, []); m.get(r.set).push(r); });
    return [...m].map(([k, arr]) => `<section class="set"><h3>${esc(S.idx.sets[k].name)}</h3><ul class="rl">${arr.map(item).join("")}</ul></section>`).join(""); };
  const counts = subCounts(d), keys = Object.keys(counts).sort((x, y) => parseInt(x) - parseInt(y) || x.localeCompare(y));
  const whole = direct.filter(r => !(r.sb || []).length);
  let h = "";
  if (keys.length) h += `<div class="chips" role="group" aria-label="Narrow the rules to a sub-section"><button data-sub="" aria-pressed="${!sub}">All (${direct.length})</button>${keys.map(k => `<button data-sub="${esc(k)}" aria-pressed="${sub === k}">(${esc(k)})<span>${counts[k]}</span></button>`).join("")}</div>`;
  if (sub) {
    const spec = direct.filter(r => (r.sb || []).includes(sub));
    h += spec.length ? `<p class="small">${spec.length} ${spec.length === 1 ? "rule cites" : "rules cite"} sub-section (${esc(sub)}) of section ${esc(d.n)}.</p>${sets(spec)}`
                     : `<p class="small">No rule names sub-section (${esc(sub)}). The rules below cite the section as a whole.</p>`;

/* ---------- reading progress (the red tape) ---------- */
let ticking = false;

/* ---------- drafting ---------- */
const D = { idx: null, cur: null, vals: {}, focus: "" };
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmtDate = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ""); return m ? `${+m[3]} ${MONTHS[+m[2] - 1]} ${m[1]}` : (v || ""); };

  const day = st.pad ? p2(d) : String(d); let suf = st.ord ? ordSuf(d) : ""; if (st.sufu) suf = suf.toUpperCase();
  return st.order === "dmy" ? day + suf + st.sep + mon + st.msuf + st.ysep + y : mon + st.msuf + st.sep + day + suf + st.ysep + y;
}
const tokText = (f, si) => { if (f.type !== "date") return dval(f); const st = si !== undefined && (f.styles || [])[si]; return D.vals[f.id] ? (st ? fmtStyle(D.vals[f.id], st) : fmtDate(D.vals[f.id])) : ""; };

function pvHTML(d) {
  return d.preview.map(p => {
    if (p.k === "gap") return `<div class="gap"></div>`;
    const cls = p.k.split(" ").filter(Boolean).map(x => "k-" + x).join(" ");
    const html = p.t.split(/(⟦f\d+(?:#\d+)?⟧)/).map(part => {

      if (!m) return esc(part).replace(/\t/g, '<span class="tb"></span>');
      const f = d.fields.find(x => x.id === m[1]); if (!f) return "";
      const v = tokText(f, m[2] === undefined ? undefined : +m[2]), on = D.focus === f.id ? " on" : "";
      return v ? `<span class="v${on}" data-f="${f.id}">${esc(v)}</span>` : `<span class="bl${on}" data-f="${f.id}">${esc(f.label)}</span>`;
    }).join("");

}
function drawPreview() {
  const d = D.cur; if (!d) return;

  $("#prog").innerHTML = d.auto ? `${req.length} details found in this draft` : req.length ? `${done} of ${req.length} details filled in<i><b style="--w:${Math.round(100 * done / req.length)}%"></b></i>` : "";
}
function fieldHTML(f) {

  let inp;
  if (f.type === "long") inp = `<textarea id="${id}" data-f="${f.id}" rows="3"></textarea>`;
  else if (f.type === "date") inp = `<input id="${id}" data-f="${f.id}" type="date">`;
  else if (f.type === "choice" && f.options.length) inp = `<select id="${id}" data-f="${f.id}"><option value="">Choose…</option>${f.options.map(o => `<option>${esc(o)}</option>`).join("")}</select>`;
  else inp = `<input id="${id}" data-f="${f.id}" type="text" ${f.type === "number" ? 'inputmode="decimal"' : ""} autocomplete="off">`;

}

/* Word files are zip files. These functions open one, change the text parts and save it again. */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    const ds = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true), cs = dv.getUint32(p + 20, true);
    out.push({ name: new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl)), nameBytes: u8.subarray(p + 46, p + 46 + nl),

}
function writeZip(ents) {

    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, e.flags, true); h.setUint16(8, e.method, true); h.setUint16(12, 0x21, true);
    h.setUint32(14, e.crc, true); h.setUint32(18, e.data.length, true); h.setUint32(22, e.us, true); h.setUint16(26, e.nameBytes.length, true);
    chunks.push(h, e.nameBytes, e.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, e.flags, true); c.setUint16(10, e.method, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, e.crc, true); c.setUint32(20, e.data.length, true); c.setUint32(24, e.us, true); c.setUint16(28, e.nameBytes.length, true); c.setUint32(42, off, true);

async function inflateRaw(u8) {

const xmlEsc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
async function makeDocx(d) {

  const ents = readZip(new Uint8Array(await res.arrayBuffer())), enc = new TextEncoder(), dec = new TextDecoder();

    if (!d.parts.includes(e.name)) continue;

/* ---------- routing and keys ---------- */
function parseHash() {
  const h = location.hash.replace(/^#/, "") || "/"; const [p, qs] = h.split("?");
  const m = p.match(/^\/s\/([^/]+)/);
  return { sec: m ? decodeURIComponent(m[1]).toUpperCase() : null, q: new URLSearchParams(qs || "") };
}
async function route() {
  if (!S.idx) return;
  const hh = location.hash.replace(/^#/, ""), dm = hh.match(/^\/d\/([^/?]+)/), onDr = hh.startsWith("/drafts") || !!dm;
  const nd = $("#navdraft"); if (nd) { if (onDr) nd.setAttribute("aria-current", "page"); else nd.removeAttribute("aria-current"); }
  if (dm) return showDraft(decodeURIComponent(dm[1]));
  if (hh.startsWith("/drafts")) return showDrafts();
  const { sec, q } = parseHash();
  if (!sec) return showHome();
  if (S.map[sec] === undefined) return showMessage(`<p>The Act has no section ${esc(sec)}. Sections run from 1 to ${esc(S.order[S.order.length - 1])}.</p><div class="find"><div class="field"><span class="sym" aria-hidden="true">§</span><input id="q3" type="search" placeholder="Try another section number" autocomplete="off" aria-label="Search the Act"></div><div class="results" id="res3" hidden></div></div>`), mountSearch($("#q3"), $("#res3")), $("#q3").focus();
  await showSection(sec, q);
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => {

    if (S.order[i]) location.hash = `#/s/${S.order[i]}`;
  }
});
