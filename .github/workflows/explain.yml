name: Explain in simple words
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: explain
  cancel-in-progress: false
jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - id: ai
        name: Write explanations with the free Gemini API
        run: python "$(find . -name ai_explain.py -not -path './.git/*' | head -n 1)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
      - name: Save the explanations
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ai data/ai_report.md 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update AI explanations"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 6
          done
          echo "Could not save the explanations this time. They will be written again next run."
          exit 0
      - name: Rebuild the website with the new explanations
        if: steps.ai.outputs.new != '' && steps.ai.outputs.new != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-data.yml --ref "${{ github.ref_name }}"
