name: Build data and website
on:
  push:
    paths: ["**.pdf", "**.py", "web/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install PDF library
        run: pip install pymupdf
      - name: Extract text from PDFs
        run: python "$(find . -name extract.py -not -path './.git/*' | head -n 1)"
      - name: Split the Act into sections and validate
        run: python "$(find . -name parse_act.py -not -path './.git/*' | head -n 1)"
      - name: Parse the Rules and link them to sections
        run: python "$(find . -name parse_rules.py -not -path './.git/*' | head -n 1)"
      - name: Build the website
        run: python "$(find . -name build_site.py -not -path './.git/*' | head -n 1)"
      - name: Save reports (even if a step failed)
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: reports, path: "data/*.md"}
      - name: Commit generated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/*.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update generated data"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 6
          done
          echo "Could not save the generated data files this time. The website is still published."
          exit 0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
