name: Build data

on:
  push:
    paths:
      - "act/**"
      - "rules/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF library
        run: pip install pymupdf

      - name: Extract text from PDFs
        run: python scripts/extract.py

      - name: Split the Act into sections and validate
        run: python scripts/parse_act.py

      - name: Save reports (even if validation failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: data/*.md

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sections.json data/*.md
          git diff --cached --quiet || git commit -m "Update generated data"
          git push
